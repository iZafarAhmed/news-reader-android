<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#f7f7f5; --card:#fff; --ink:#111; --mut:#8a8a8a; --line:#ececec; --acc:#1a73e8; }
* { box-sizing: border-box; }
body { width: 480px; max-width: 100vw; margin: 0 auto; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
button { font-family: inherit; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
.brand { font-size: 15px; font-weight: 800; letter-spacing: 2px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.iconbtn { border: none; background: transparent; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #444; }
.iconbtn:hover { background: #ececec; }
.iconbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#1a73e8,#7b4ae2); }

/* search */
.searchwrap { padding: 0 16px 10px; }
.search { position: relative; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: #9a9a9a; fill: none; stroke-width: 2; stroke-linecap: round; }
#q { width: 100%; padding: 10px 14px 10px 36px; border: none; border-radius: 12px; background: #eceae7; font-size: 13px; outline: none; }
#q:focus { background: #fff; box-shadow: 0 0 0 2px var(--acc); }

/* level-1 pills */
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 12px; border-bottom: 1px solid var(--line); }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; border: 1px solid #e0dedb; background: #fff; color: #333; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: .15s; }
.pill.active { background: #111; color: #fff; border-color: #111; }

/* level-2 sub chips */
.subs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.subs::-webkit-scrollbar { display: none; }
.subs.hidden { display: none; }
.subchip { flex: 0 0 auto; border: none; background: #f1f3f4; color: #444; font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: .15s; }
.subchip.active { background: var(--acc); color: #fff; }

/* briefing */
.brief { padding: 16px 16px 4px; }
.brief h2 { margin: 0; font-size: 13px; letter-spacing: 1.5px; font-weight: 800; }
.brief p { margin: 2px 0 0; font-size: 12px; color: var(--mut); }

/* top story */
.topstory { margin: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; display: block; max-width: calc(100vw - 32px); }
.topstory .hero { width: 100%; height: 170px; object-fit: cover; display: block; }
.ts-body { padding: 14px 16px; }
.ts-kicker { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--acc); }
.ts-kicker .fav { width: 14px; height: 14px; border-radius: 50%; }
.ts-head { margin: 6px 0 8px; font-size: 19px; line-height: 1.35; font-weight: 700; color: var(--acc); }
.ts-meta { font-size: 12px; color: var(--mut); display: flex; gap: 6px; align-items: center; }
.ts-meta .src-chip { color: var(--acc); font-weight: 600; cursor: pointer; }

/* latest list */
.latest h3 { margin: 18px 16px 6px; font-size: 11px; letter-spacing: 1.2px; color: var(--mut); font-weight: 800; }
.row { display: flex; gap: 12px; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-child { border-top: none; }
.row .txt { flex: 1; min-width: 0; }
.row .srcline { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: var(--mut); text-transform: uppercase; }
.row .srcline .fav { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
.row .srcline svg.clk { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.row .head { margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--acc); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
.save { border: none; background: none; cursor: pointer; color: #bbb; width: 26px; height: 26px; flex: 0 0 auto; align-self: flex-start; }
.save svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.save.on { color: var(--acc); }
.save.on svg { fill: var(--acc); }

/* bottom nav */
.bottomnav { position: sticky; bottom: 0; display: flex; background: #fff; border-top: 1px solid var(--line); }
.bnav { flex: 1; border: none; background: none; padding: 9px 0 10px; cursor: pointer; color: #8a8a8a; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; }
.bnav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bnav.active { color: var(--ink); }

/* sheet, scrim, toast */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 15; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); max-height: 70%; overflow: auto; display: none; z-index: 20; padding: 14px 0 20px; }
#sheet h4 { margin: 0 16px 8px; font-size: 12px; letter-spacing: 1px; color: var(--mut); }
#sheet a { display: block; padding: 10px 16px; text-decoration: none; color: var(--ink); font-size: 13px; border-top: 1px solid #f2f2f2; }
#sheet a span { color: var(--mut); font-size: 11px; display: block; margin-top: 2px; }
#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #202124; color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">NEWS</span>
    <div class="top-actions">
      <button class="iconbtn" id="bell" title="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg></button>
      <span class="avatar"></span>
    </div>
  </header>

  <div class="searchwrap">
    <form id="form" class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
      <input id="q" type="text" placeholder="Search news, topics, people" />
    </form>
  </div>

  <nav class="pills" id="pills"></nav>
  <nav class="subs hidden" id="subs"></nav>

  <section class="brief" id="brief">
    <h2 id="greet"></h2>
    <p id="sub"></p>
  </section>

  <a class="topstory" id="topstory" href="#" target="_blank" rel="noopener"></a>

  <section class="latest">
    <h3 id="latestTitle">LATEST STORIES</h3>
    <div id="grid"></div>
  </section>

  <nav class="bottomnav">
    <button class="bnav active" id="navHome"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button class="bnav" id="navSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>Search</button>
    <button class="bnav" id="navSaved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
    <button class="bnav" id="navMenu"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>More</button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
