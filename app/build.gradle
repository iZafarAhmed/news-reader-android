plugins { id 'com.android.application' }

android {
    namespace 'com.example.newsreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.newsreader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
